[package]
name = "tabscreen-host"
version = "0.1.0"
edition = "2024"
description = "Use an Android tablet as a touch-enabled second monitor for GNOME on Wayland"
license = "MIT"
repository = "https://github.com/arunperiyal/tabscreen"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
clap = { version = "4.6.7", features = ["derive"] }
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
gstreamer-video = "0.24.5"
pipewire = "0.10"
qrcode = "0.14.1"
rand = "0.10.3"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
zbus = "5"

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.29"

[profile.release]
strip = true
lto = "thin"
