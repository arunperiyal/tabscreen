[package]
name = "tabscreen-host"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
gstreamer-video = "0.24.5"
pipewire = "0.10"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
zbus = "5"

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.29"
